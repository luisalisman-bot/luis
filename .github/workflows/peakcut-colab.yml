name: Verify free Colab notebook
on:
  push:
    branches: [peakcut-colab]
permissions:
  contents: read
jobs:
  colab-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check notebook and free processing configuration
        run: python colab/test_runtime.py
      - name: Ensure video tools are available
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Process a public test video through the notebook helper
        run: python colab/check_runtime.py
